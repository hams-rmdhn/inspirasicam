<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InspirasiCam</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="frame">
      <video id="cam" autoplay playsinline muted></video>
      <div id="status" hidden></div>
      <div id="rec" hidden><span class="dot"></span><span id="rec-time">00:00</span></div>
      <div id="toast" hidden></div>
      <button id="close" type="button" aria-label="Tutup" title="Tutup">&times;</button>
      <div id="resize-handle" aria-hidden="true"></div>
    </div>
  </body>
</html>
